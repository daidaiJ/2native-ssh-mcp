# Release workflow template for small Go open-source projects.
#
# Trigger: push an annotated tag (git tag -a v1.0.0 -m "...")
#   - builds binaries for windows/linux/darwin x amd64/arm64 (CGO_ENABLED=0)
#   - injects the tag name as the binary version (-X main.version=<tag>)
#   - release notes = the annotated tag message (read via GitHub API)
#   - attaches every binary with its own .sha256 checksum
#   - one CycloneDX SBOM (2native-ssh-mcp.cdx.json); SLSA provenance + SBOM
#     attestations go to the repo Attestations tab (not extra release files)
#   - packages each binary as an .mcpb bundle (MCP Bundle, zip + manifest.json)
#   - a tag with the "-registry" suffix (e.g. v1.0.0-registry) additionally
#     publishes the matching stable release (v1.0.0) to the official MCP
#     Registry (registry.modelcontextprotocol.io) via OIDC. Publishing to the
#     registry is explicit: plain tags (v1.0.0) only build the release.
#
# To reuse in another project: replace "2native-ssh-mcp" with your binary
# name, make sure main.go declares `var version = "..."` (not const), and
# update the registry name/URL in the publish-registry job.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.arch }}
    if: ${{ !endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            arch: amd64
            ext: .exe
            mcpbPlatform: win32
          - goos: windows
            arch: arm64
            ext: .exe
            mcpbPlatform: win32
          - goos: linux
            arch: amd64
            ext: ''
            mcpbPlatform: linux
          - goos: linux
            arch: arm64
            ext: ''
            mcpbPlatform: linux
          - goos: darwin
            arch: amd64
            ext: ''
            mcpbPlatform: darwin
          - goos: darwin
            arch: arm64
            ext: ''
            mcpbPlatform: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Package MCPB bundle
        run: |
          mkdir -p bundle/server
          cp dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} \
            bundle/server/2native-ssh-mcp${{ matrix.ext }}
          cat > bundle/manifest.json <<'EOF'
          {
            "manifest_version": "0.3",
            "name": "2native-ssh-mcp",
            "display_name": "2native SSH MCP Server",
            "version": "${{ github.ref_name }}",
            "description": "SSH-based MCP server for remote command execution and file transfer. Credentials stay local.",
            "author": {
              "name": "daidaiJ"
            },
            "server": {
              "type": "binary",
              "entry_point": "server/2native-ssh-mcp${{ matrix.ext }}",
              "mcp_config": {
                "command": "${__dirname}/server/2native-ssh-mcp${{ matrix.ext }}",
                "args": [],
                "env": {}
              }
            },
            "compatibility": {
              "platforms": ["${{ matrix.mcpbPlatform }}"]
            }
          }
          EOF
          (cd bundle && zip -r ../dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}.mcpb .)
          sha256sum dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}.mcpb \
            > dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}.mcpb.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
            dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}.mcpb
            dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}.mcpb.sha256
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    if: ${{ !endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Release notes come from the annotated tag message, read via the
      # GitHub API. The local checkout may only hold a lightweight tag ref,
      # whose %(contents) falls back to the commit message, so local git
      # cannot be trusted here.
      - name: Read tag message
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/${{ github.ref_name }}")"
          TYPE="$(echo "$REF" | jq -r '.object.type')"
          if [ "$TYPE" = "tag" ]; then
            SHA="$(echo "$REF" | jq -r '.object.sha')"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.message' > notes.md
          else
            echo "${{ github.ref_name }}" > notes.md
          fi

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for f in 2native-ssh-mcp-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/2native-ssh-mcp.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/2native-ssh-mcp-windows-amd64.exe
            dist/2native-ssh-mcp-windows-arm64.exe
            dist/2native-ssh-mcp-linux-amd64
            dist/2native-ssh-mcp-linux-arm64
            dist/2native-ssh-mcp-darwin-amd64
            dist/2native-ssh-mcp-darwin-arm64
            dist/2native-ssh-mcp-windows-amd64.mcpb
            dist/2native-ssh-mcp-windows-arm64.mcpb
            dist/2native-ssh-mcp-linux-amd64.mcpb
            dist/2native-ssh-mcp-linux-arm64.mcpb
            dist/2native-ssh-mcp-darwin-amd64.mcpb
            dist/2native-ssh-mcp-darwin-arm64.mcpb

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: |
            dist/2native-ssh-mcp-windows-amd64.exe
            dist/2native-ssh-mcp-windows-arm64.exe
            dist/2native-ssh-mcp-linux-amd64
            dist/2native-ssh-mcp-linux-arm64
            dist/2native-ssh-mcp-darwin-amd64
            dist/2native-ssh-mcp-darwin-arm64
            dist/2native-ssh-mcp-windows-amd64.mcpb
            dist/2native-ssh-mcp-windows-arm64.mcpb
            dist/2native-ssh-mcp-linux-amd64.mcpb
            dist/2native-ssh-mcp-linux-arm64.mcpb
            dist/2native-ssh-mcp-darwin-amd64.mcpb
            dist/2native-ssh-mcp-darwin-arm64.mcpb
          sbom-path: dist/2native-ssh-mcp.cdx.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" \
            dist/2native-ssh-mcp-* \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md

  publish-registry:
    name: Publish to MCP Registry
    # Triggered only by a "-registry" suffix tag (e.g. v1.0.0-registry).
    # Publishes the matching stable release (v1.0.0) to the official registry.
    if: ${{ endsWith(github.ref_name, '-registry') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download MCPB bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v1.0.0-registry
          BASE_TAG="${TAG%-registry}"             # v1.0.0
          echo "Publishing $BASE_TAG to MCP Registry"
          mkdir -p mcpb-assets
          gh release download "$BASE_TAG" \
            --pattern "*.mcpb" --pattern "*.mcpb.sha256" \
            --dir mcpb-assets

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Generate server.json
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v1.0.0-registry
          BASE_TAG="${TAG%-registry}"             # v1.0.0
          VERSION="${BASE_TAG#v}"                 # 1.0.0
          PACKAGES='[]'
          for f in mcpb-assets/*.mcpb; do
            base="$(basename "$f" .mcpb)"
            sha="$(awk '{print $1}' "$f.sha256")"
            url="https://github.com/daidaiJ/2native-ssh-mcp/releases/download/$BASE_TAG/$base.mcpb"
            PACKAGES="$(jq --arg url "$url" --arg sha "$sha" \
              '. + [{"registryType":"mcpb","identifier":$url,"fileSha256":$sha,"transport":{"type":"stdio"}}]' \
              <<< "$PACKAGES")"
          done
          jq -n \
            --arg name "io.github.daidaiJ/2native-ssh-mcp" \
            --arg version "$VERSION" \
            --argjson packages "$PACKAGES" \
            '{
              "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
              "name": $name,
              "title": "2native SSH MCP Server",
              "description": "SSH-based MCP server for remote command execution and file transfer. Credentials stay local.",
              "version": $version,
              "repository": {
                "url": "https://github.com/daidaiJ/2native-ssh-mcp",
                "source": "github"
              },
              "packages": $packages
            }' > server.json
          echo "--- server.json ---"
          jq . server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish