# Release workflow template for small Go open-source projects.
#
# Trigger: push an annotated tag (git tag -a v1.0.0 -m "...")
#   - builds binaries for windows/linux/darwin x amd64/arm64 (CGO_ENABLED=0)
#   - injects the tag name as the binary version (-X main.version=<tag>)
#   - release notes = the annotated tag message (read via GitHub API)
#   - attaches every binary with its own .sha256 checksum
#
# To reuse in another project: replace "2native-ssh-mcp" with your binary
# name, and make sure main.go declares `var version = "..."` (not const).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            arch: amd64
            ext: .exe
          - goos: windows
            arch: arm64
            ext: .exe
          - goos: linux
            arch: amd64
            ext: ''
          - goos: linux
            arch: arm64
            ext: ''
          - goos: darwin
            arch: amd64
            ext: ''
          - goos: darwin
            arch: arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/2native-ssh-mcp-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release notes come from the annotated tag message, read via the
      # GitHub API. The local checkout may only hold a lightweight tag ref,
      # whose %(contents) falls back to the commit message, so local git
      # cannot be trusted here.
      - name: Read tag message
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REF="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/${{ github.ref_name }}")"
          TYPE="$(echo "$REF" | jq -r '.object.type')"
          if [ "$TYPE" = "tag" ]; then
            SHA="$(echo "$REF" | jq -r '.object.sha')"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.message' > notes.md
          else
            echo "${{ github.ref_name }}" > notes.md
          fi

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for f in 2native-ssh-mcp-*; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" \
            dist/2native-ssh-mcp-* \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md