# CI: race-enabled tests on Linux (CGO available). The release workflow
# keeps CGO_ENABLED=0 for static binaries; -race is not run on Windows
# runners (needs a C toolchain there).

name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Test with race detector
        run: go test -race ./...
