# CI: race-enabled tests on Linux (CGO available). The release workflow
# keeps CGO_ENABLED=0 for static binaries; -race is not run on Windows
# runners (needs a C toolchain there).

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tidy modules
        run: go mod tidy

      - name: Test with race detector
        run: go test -race ./...